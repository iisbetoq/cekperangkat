# Daftar perangkat yang dimonitor cekmac.sh
# Tambah perangkat baru = tambah 1 baris, tanpa edit script.
#
# Format (pisahkan dengan | ):
#   MAC | ALIAS | IP (opsional) | PORT (opsional) | MAX_MISS (opsional)
#
#   MAC      : wajib, huruf kecil/besar bebas
#   ALIAS    : wajib, nama tampilan di Telegram (tanpa spasi, tanpa |)
#   IP       : opsional, IP statik device. Dipakai untuk membangunkan device
#              sebelum scan (unicast ping/arping) + fallback cek TCP.
#              Kosongkan jika IP tidak tetap.
#   PORT     : opsional, port TCP yang dicek bila ping gagal (misal 80/22/38599)
#   MAX_MISS : opsional, berapa kali miss berturut-turut sebelum dinotif.
#              Default 3 (= 15 menit jika cron 5 menit). Naikkan untuk HP yang
#              suka deep-sleep, misal 6 (= 30 menit).
#
# Contoh tambah perangkat baru:  aa:bb:cc:dd:ee:ff|HP03|192.168.1.104||6

aa:bb:cc:dd:ee:ff|PC01|192.168.1.100||1
aa:bb:cc:dd:ee:ff|PC02|192.168.1.101||1
aa:bb:cc:dd:ee:ff|HP01|192.168.1.102||
aa:bb:cc:dd:ee:ff|HP02|192.168.1.103||
